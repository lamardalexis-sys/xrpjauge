name: Mise à jour du thermomètre XRP

on:
  schedule:
    # Toutes les heures, à la minute 17 (évite la congestion de :00 chez GitHub)
    - cron: "17 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "collect.py"
      - "news.py"
      - "events.json"
      - "manual.json"
      - "themes.json"
      - "whales.py"
      - "levels.json"
      - "exchanges.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-gauge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collecte et calcul du score
        env:
          # Zone d'achat personnelle (modifiable ici sans toucher au code)
          BUY_ZONE_HIGH: "1.12"
          BUY_ZONE_LOW: "0.90"
          # Classification IA des titres (optionnelle). Crée le secret LLM_API_KEY dans
          # Settings → Secrets and variables → Actions. Sans secret, le lexique seul est utilisé.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: "anthropic"        # ou "openai"
          LLM_MODEL: ""                    # vide = défaut du provider (claude-haiku-4-5 / gpt-4o-mini)
          LLM_EVERY_HOURS: "3"             # appel IA au plus toutes les 3 h (cache entre-temps)
          # Baleines : clé gratuite whale-alert.io (secret WHALE_ALERT_KEY). Sans elle, XRP Ledger direct seul.
          WHALE_ALERT_KEY: ${{ secrets.WHALE_ALERT_KEY }}
          XRPL_LEDGERS: "450"              # ledgers XRPL lus par run (~4 s chacun → ~10 min de couverture)
        run: python collect.py --verbose

      - name: Commit de docs/data.json si modifié
        run: |
          git config user.name "gauge-bot"
          git config user.email "gauge-bot@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "Rien à committer"
          else
            git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push
          fi
