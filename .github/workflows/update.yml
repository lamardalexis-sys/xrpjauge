name: Mise à jour du thermomètre XRP

on:
  schedule:
    # Toutes les heures, à la minute 17 (évite la congestion de :00 chez GitHub)
    - cron: "17 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "collect.py"
      - "events.json"
      - "manual.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-gauge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collecte et calcul du score
        env:
          # Zone d'achat personnelle (modifiable ici sans toucher au code)
          BUY_ZONE_HIGH: "1.12"
          BUY_ZONE_LOW: "0.90"
        run: python collect.py --verbose

      - name: Commit de docs/data.json si modifié
        run: |
          git config user.name "gauge-bot"
          git config user.email "gauge-bot@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "Rien à committer"
          else
            git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push
          fi
